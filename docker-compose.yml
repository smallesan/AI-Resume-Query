services:
  app:
    image: 580983240259.dkr.ecr.us-east-2.amazonaws.com/resume-agent:latest
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./data:/app/data:ro
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/self-signed.crt:/etc/nginx/ssl/self-signed.crt:ro
      - /etc/nginx/ssl/self-signed.key:/etc/nginx/ssl/self-signed.key:ro
      - /etc/nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
    depends_on:
      - app