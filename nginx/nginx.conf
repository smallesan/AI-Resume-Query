server_tokens off;

server {
  listen 443 ssl;
  server_name mallesan.name www.mallesan.name mallesan.net www.mallesan.net;

  # Self-signed certificate
  ssl_certificate     /etc/nginx/ssl/self-signed.crt;
  ssl_certificate_key /etc/nginx/ssl/self-signed.key;

  # SSL settings
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       10m;

  # Diffie-Hellman (if you generated it in Step 2)
  ssl_dhparam /etc/nginx/ssl/dhparam.pem;

  # Security headers
  add_header X-Content-Type-Options  "nosniff" always;
  add_header X-Frame-Options         "DENY" always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

  # Forward real client IP — replace X-Forwarded-For so clients cannot spoof it
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_http_version 1.1;
  proxy_set_header   Upgrade $http_upgrade;
  proxy_cache_bypass $http_upgrade;

  # # Timeouts
  proxy_connect_timeout 60s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # --- URL allowlist ---
  # Only the paths below reach the app; everything else is silently dropped (444).

  # Block WebDAV methods silently
  if ($request_method ~* "^(PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|SEARCH)$") {
    return 444;    # Nginx drops connection with no response
  }

  # Main page
  location = / {
    proxy_pass http://app:3000;
  }

  # Next.js static assets (JS bundles, CSS, fonts)
  location ^~ /_next/static/ {
    proxy_pass http://app:3000;
  }

  # Chat API — POST only
  location = /api/chat {
    if ($request_method != POST) { return 444; }
    proxy_pass http://app:3000;
  }

  # Job-fit API — POST only
  location = /api/job-fit {
    if ($request_method != POST) { return 444; }
    proxy_pass http://app:3000;
  }

  # Public SVG assets served from /public
  location ~* ^/[^/]+\.svg$ {
    proxy_pass http://app:3000;
  }

  # Favicon
  location = /favicon.ico {
    proxy_pass http://app:3000;
  }

  # Drop everything else silently — no response to probes
  location / {
    return 444;
  }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name mallesan.name www.mallesan.name mallesan.net www.mallesan.net;
    return 301 https://$host$request_uri;
}

