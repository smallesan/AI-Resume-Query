server_tokens off;

server {
  listen 80;
  server_name _;

  # Security headers
  add_header X-Content-Type-Options  "nosniff" always;
  add_header X-Frame-Options         "DENY" always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

  # Forward real client IP — replace X-Forwarded-For so clients cannot spoof it
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # --- URL allowlist ---
  # Only the paths below reach the app; everything else is silently dropped (444).

  # Main page
  location = / {
    proxy_pass http://app:3000;
  }

  # Next.js static assets (JS bundles, CSS, fonts)
  location ^~ /_next/static/ {
    proxy_pass http://app:3000;
  }

  # Chat API — POST only
  location = /api/chat {
    if ($request_method != POST) { return 444; }
    proxy_pass http://app:3000;
  }

  # Job-fit API — POST only
  location = /api/job-fit {
    if ($request_method != POST) { return 444; }
    proxy_pass http://app:3000;
  }

  # Public SVG assets served from /public
  location ~* ^/[^/]+\.svg$ {
    proxy_pass http://app:3000;
  }

  # Favicon
  location = /favicon.ico {
    proxy_pass http://app:3000;
  }

  # Drop everything else silently — no response to probes
  location / {
    return 444;
  }
}
